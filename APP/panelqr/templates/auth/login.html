{% extends "base.html" %}
{% block title %}Iniciar sesión · Panel QR{% endblock %}
{% block public_content %}
  <section class="login-card">
    <div class="login-brand">
      <span class="logo large" aria-hidden="true">QR</span>
      <div><h1>Panel QR</h1><p>Documentación técnica de paneles eléctricos</p></div>
    </div>
    <h2>Iniciar sesión</h2>
    <p class="muted">Acceso exclusivo para personal autorizado.</p>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button primary full" type="submit">Entrar</button>
    </form>
  </section>
{% endblock %}
